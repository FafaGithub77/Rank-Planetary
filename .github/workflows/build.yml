name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Si attiva automaticamente quando crei un tag es. v1.0.1
  workflow_dispatch:  # Ti permette anche di avviarlo manualmente dalla scheda Actions

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: rank_planetary_gui_windows.zip
          - name: macOS Apple Silicon
            os: macos-latest        # arm64
            artifact_name: rank_planetary_gui_macos_apple_silicon.zip
          - name: macOS Intel
            os: macos-15-intel      # x86_64
            artifact_name: rank_planetary_gui_macos_intel.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "rank_planetary_gui" rank_planetary_gui.py

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path "dist/rank_planetary_gui" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Archive artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/rank_planetary_gui.app ${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
          generate_release_notes: true
