name: Build Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-13]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python tifffile pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name rank_planetary rank_planetary_gui.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rank_planetary-${{ matrix.os }}
        path: |
          dist/rank_planetary
          dist/rank_planetary.exe